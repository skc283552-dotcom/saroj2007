<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Personal Accounting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Header with Logo and Clock -->
        <div class="flex justify-between items-center mb-8 bg-white rounded-lg shadow-md p-4">
            <div id="logo-placeholder"></div>
            <div class="text-right">
                <div id="liveClock" class="text-2xl font-bold text-gray-800"></div>
                <div class="text-sm text-gray-600">Welcome, <span id="userEmail"></span></div>
            </div>
        </div>

        <!-- Navigation Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <a href="accounting.html" class="bg-white rounded-xl shadow-md hover:shadow-xl transition duration-300 p-6 transform hover:scale-105">
                <div class="text-indigo-600 mb-4">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-gray-800">Accounting System</h3>
                <p class="text-gray-600 mt-2">Add and manage transactions</p>
            </a>

            <a href="buygoods.html" class="bg-white rounded-xl shadow-md hover:shadow-xl transition duration-300 p-6 transform hover:scale-105">
                <div class="text-green-600 mb-4">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-gray-800">Buy Goods</h3>
                <p class="text-gray-600 mt-2">Purchase tracking system</p>
            </a>

            <a href="ledger.html" class="bg-white rounded-xl shadow-md hover:shadow-xl transition duration-300 p-6 transform hover:scale-105">
                <div class="text-blue-600 mb-4">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-gray-800">Ledger</h3>
                <p class="text-gray-600 mt-2">View and manage all transactions</p>
            </a>

            <a href="alerts.html" class="bg-white rounded-xl shadow-md hover:shadow-xl transition duration-300 p-6 transform hover:scale-105">
                <div class="text-red-600 mb-4">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h3 class="text-xl font-semibold text-gray-800">Alerts & Budget</h3>
                <p class="text-gray-600 mt-2">Budget monitoring and alerts</p>
            </a>
        </div>

        <!-- Chart Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Income vs Expenses</h2>
            <canvas id="incomeExpenseChart" class="w-full h-64"></canvas>
            <div id="budgetAlert" class="mt-4 text-center font-bold"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check authentication
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('userEmail').textContent = user.email;
                loadChartData(user.uid);
                loadLogo();
            }
        });

        // Live Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleString();
        }
        updateClock();
        setInterval(updateClock, 1000);

        async function loadLogo() {
            try {
                const response = await fetch('logo.html');
                const logoHtml = await response.text();
                document.getElementById('logo-placeholder').innerHTML = logoHtml;
            } catch (error) {
                document.getElementById('logo-placeholder').innerHTML = '<div class="text-2xl font-bold text-indigo-600">PAS</div>';
            }
        }

        async function loadChartData(userId) {
            const transactionsRef = collection(db, 'transactions');
            const q = query(transactionsRef, where('userId', '==', userId));
            const querySnapshot = await getDocs(q);
            
            let income = 0;
            let expenses = 0;
            const budgetLimit = 5000;

            querySnapshot.forEach((doc) => {
                const transaction = doc.data();
                if (transaction.accountType === 'Income') {
                    income += transaction.amount || 0;
                } else if (transaction.accountType === 'Expense') {
                    expenses += transaction.amount || 0;
                }
            });

            // Create chart
            const ctx = document.getElementById('incomeExpenseChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Income', 'Expenses'],
                    datasets: [{
                        label: 'Amount ($)',
                        data: [income, expenses],
                        backgroundColor: ['rgba(34, 197, 94, 0.5)', 'rgba(239, 68, 68, 0.5)'],
                        borderColor: ['rgb(34, 197, 94)', 'rgb(239, 68, 68)'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Amount ($)'
                            }
                        }
                    }
                }
            });

            // Budget alert
            const alertDiv = document.getElementById('budgetAlert');
            if (expenses > budgetLimit) {
                alertDiv.innerHTML = ⚠️ WARNING: Expenses ($${expenses}) have exceeded budget limit ($${budgetLimit})! ⚠️;
                alertDiv.className = 'mt-4 text-center font-bold text-red-600';
            } else {
                alertDiv.innerHTML = ✅ Budget Status: Expenses ($${expenses}) within limit ($${budgetLimit});
                alertDiv.className = 'mt-4 text-center font-bold text-green-600';
            }
        }
    </script>
</body>
</html>dashboj
