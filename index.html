<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // 🔥 REPLACE WITH YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    window._fb = { db, auth, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, where, signInWithEmailAndPassword, signOut, onAuthStateChanged };
    onAuthStateChanged(auth, user => {
      if (user) { window._fbUser = user; }
    });
  } catch(e) { console.log('Firebase not configured, using demo mode'); }
</script>

<style>
:root {
  --gold: #c9a84c;
  --gold2: #e8c97a;
  --gold3: #f5e6b8;
  --dark: #080808;
  --dark2: #111111;
  --dark3: #1a1a1a;
  --dark4: #222222;
  --border: #2a2a2a;
  --text: #f0ead6;
  --text2: #888880;
  --text3: #555550;
  --red: #e05252;
  --green: #52c97a;
  --blue: #528ae0;
  --esewa: #60bb46;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--dark);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* ═══════════════════════════
   PORTFOLIO PAGE
═══════════════════════════ */
#portfolio-page {
  min-height:100vh;
  position:relative;
  overflow:hidden;
}

/* Gold grain overlay */
#portfolio-page::before {
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:0;
  opacity:0.4;
}

/* Radial gold glow */
.bg-glow {
  position:fixed;
  width:600px;height:600px;
  background:radial-gradient(circle, rgba(201,168,76,0.08) 0%, transparent 70%);
  top:-100px;right:-100px;
  pointer-events:none;
}

.bg-glow2 {
  position:fixed;
  width:400px;height:400px;
  background:radial-gradient(circle, rgba(201,168,76,0.05) 0%, transparent 70%);
  bottom:0;left:0;
  pointer-events:none;
}

/* NAV */
.port-nav {
  position:fixed;
  top:0;left:0;right:0;
  padding:20px 48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:100;
  border-bottom:1px solid rgba(201,168,76,0.1);
  background:rgba(8,8,8,0.8);
  backdrop-filter:blur(20px);
}

.port-logo {
  font-family:'Playfair Display',serif;
  font-size:22px;
  font-weight:900;
  color:var(--gold);
  letter-spacing:2px;
  cursor:pointer;
  user-select:none;
  position:relative;
}

.port-logo::after {
  content:'';
  position:absolute;
  bottom:-2px;left:0;right:0;
  height:1px;
  background:var(--gold);
  transform:scaleX(0);
  transition:transform 0.3s;
}

.port-logo:hover::after { transform:scaleX(1); }

.port-nav-links {
  display:flex;
  gap:32px;
  list-style:none;
}

.port-nav-links a {
  color:var(--text2);
  text-decoration:none;
  font-size:14px;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:color 0.2s;
}

.port-nav-links a:hover { color:var(--gold); }

/* HERO */
.port-hero {
  min-height:100vh;
  display:flex;
  align-items:center;
  padding:120px 48px 80px;
  position:relative;
  z-index:1;
  gap:80px;
}

.hero-text { flex:1; }

.hero-eyebrow {
  font-family:'DM Mono',monospace;
  font-size:12px;
  color:var(--gold);
  letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:24px;
  display:flex;
  align-items:center;
  gap:12px;
}

.hero-eyebrow::before {
  content:'';
  width:40px;height:1px;
  background:var(--gold);
}

.hero-name {
  font-family:'Playfair Display',serif;
  font-size:clamp(52px, 8vw, 96px);
  font-weight:900;
  line-height:0.95;
  letter-spacing:-2px;
  margin-bottom:24px;
}

.hero-name .gold { color:var(--gold); }

.hero-title {
  font-size:18px;
  color:var(--text2);
  margin-bottom:32px;
  font-weight:300;
  letter-spacing:2px;
  text-transform:uppercase;
}

.hero-bio {
  font-size:16px;
  color:var(--text2);
  line-height:1.8;
  max-width:500px;
  margin-bottom:48px;
}

.hero-actions {
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}

.btn-gold {
  padding:14px 32px;
  background:var(--gold);
  color:#000;
  border:none;
  font-family:'DM Sans',sans-serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.3s;
  text-decoration:none;
  display:inline-block;
}

.btn-gold:hover {
  background:var(--gold2);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(201,168,76,0.3);
}

.btn-outline-gold {
  padding:14px 32px;
  background:transparent;
  color:var(--gold);
  border:1px solid var(--gold);
  font-family:'DM Sans',sans-serif;
  font-weight:600;
  font-size:14px;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.3s;
  text-decoration:none;
  display:inline-block;
}

.btn-outline-gold:hover {
  background:rgba(201,168,76,0.1);
  transform:translateY(-2px);
}

/* PHOTO */
.hero-photo-wrap {
  position:relative;
  flex-shrink:0;
}

.hero-photo-frame {
  width:320px;height:380px;
  position:relative;
}

.hero-photo-frame::before {
  content:'';
  position:absolute;
  top:16px;left:16px;right:-16px;bottom:-16px;
  border:1px solid var(--gold);
  opacity:0.3;
}

.hero-photo-frame::after {
  content:'';
  position:absolute;
  top:-8px;left:-8px;right:8px;bottom:8px;
  border:1px solid rgba(201,168,76,0.15);
}

.hero-photo {
  width:100%;height:100%;
  object-fit:cover;
  filter:grayscale(20%) contrast(1.05);
  position:relative;
  z-index:1;
}

.photo-tag {
  position:absolute;
  bottom:-20px;right:-20px;
  background:var(--gold);
  color:#000;
  padding:12px 20px;
  font-family:'DM Mono',monospace;
  font-size:11px;
  font-weight:500;
  letter-spacing:2px;
  z-index:2;
}

/* STATS BAR */
.hero-stats {
  display:flex;
  gap:48px;
  padding:32px 48px;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  position:relative;
  z-index:1;
}

.stat-item { text-align:center; }
.stat-num {
  font-family:'Playfair Display',serif;
  font-size:36px;
  font-weight:900;
  color:var(--gold);
}
.stat-lbl { font-size:11px; color:var(--text2); letter-spacing:2px; text-transform:uppercase; margin-top:4px; }

/* SECTIONS */
.port-section {
  padding:80px 48px;
  position:relative;
  z-index:1;
}

.section-label {
  font-family:'DM Mono',monospace;
  font-size:11px;
  color:var(--gold);
  letter-spacing:4px;
  text-transform:uppercase;
  margin-bottom:16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.section-label::after { content:''; flex:1; height:1px; background:var(--border); }

.section-title {
  font-family:'Playfair Display',serif;
  font-size:42px;
  font-weight:900;
  margin-bottom:48px;
  letter-spacing:-1px;
}

/* SKILLS */
.skills-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px,1fr));
  gap:1px;
  background:var(--border);
}

.skill-card {
  background:var(--dark2);
  padding:32px 24px;
  transition:background 0.3s;
}

.skill-card:hover { background:var(--dark3); }

.skill-icon { font-size:32px; margin-bottom:16px; }
.skill-name { font-family:'Playfair Display',serif; font-size:18px; margin-bottom:8px; }
.skill-desc { font-size:13px; color:var(--text2); line-height:1.6; }

/* CONTACT */
.contact-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:1px;
  background:var(--border);
}

.contact-card {
  background:var(--dark2);
  padding:28px 24px;
  display:flex;
  align-items:center;
  gap:16px;
  transition:background 0.3s;
}

.contact-card:hover { background:var(--dark3); }

.contact-icon {
  width:44px;height:44px;
  border:1px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
  flex-shrink:0;
  color:var(--gold);
}

.contact-label { font-size:11px; color:var(--text2); letter-spacing:1px; text-transform:uppercase; }
.contact-value { font-size:14px; color:var(--text); margin-top:4px; }

/* FOOTER */
.port-footer {
  padding:32px 48px;
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:1;
}

.footer-copy { font-size:13px; color:var(--text3); }
.footer-built { font-size:11px; color:var(--text3); font-family:'DM Mono',monospace; }

/* SECRET LOGIN TRIGGER — invisible */
.secret-trigger {
  position:fixed;
  bottom:0;right:0;
  width:1px;height:1px;
  opacity:0;
  cursor:default;
  z-index:999;
}

/* ═══════════════════════════
   LOGIN MODAL
═══════════════════════════ */
#login-modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  backdrop-filter:blur(12px);
  z-index:10000;
  align-items:center;
  justify-content:center;
}

#login-modal.open { display:flex; }

.login-box {
  background:var(--dark2);
  border:1px solid var(--gold);
  padding:48px;
  width:400px;
  max-width:90vw;
  animation:fadeUp 0.4s ease;
  position:relative;
}

.login-box::before {
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:2px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

.login-logo {
  font-family:'Playfair Display',serif;
  font-size:24px;
  font-weight:900;
  color:var(--gold);
  margin-bottom:8px;
  text-align:center;
}

.login-sub {
  text-align:center;
  font-size:12px;
  color:var(--text2);
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:36px;
  font-family:'DM Mono',monospace;
}

.login-close {
  position:absolute;
  top:16px;right:20px;
  background:none;border:none;
  color:var(--text2);cursor:pointer;
  font-size:20px;
}

.inp {
  width:100%;
  background:var(--dark3);
  border:1px solid var(--border);
  border-radius:0;
  padding:14px 16px;
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:14px;
  outline:none;
  transition:border-color 0.2s;
  margin-bottom:14px;
}

.inp:focus { border-color:var(--gold); }

.inp-label {
  font-size:11px;
  color:var(--text2);
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:8px;
  font-family:'DM Mono',monospace;
}

.btn-login {
  width:100%;
  padding:14px;
  background:var(--gold);
  color:#000;
  border:none;
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
  margin-top:8px;
}

.btn-login:hover { background:var(--gold2); }

.demo-link {
  text-align:center;
  margin-top:16px;
  font-size:12px;
  color:var(--text2);
}

.demo-link span {
  color:var(--gold);
  cursor:pointer;
  text-decoration:underline;
}

/* ═══════════════════════════
   DASHBOARD & APP
═══════════════════════════ */
#app-page { display:none; min-height:100vh; }

/* TOP BAR */
.app-topbar {
  background:var(--dark2);
  border-bottom:1px solid var(--border);
  padding:0 24px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:200;
}

.topbar-logo {
  font-family:'Playfair Display',serif;
  font-size:18px;
  font-weight:900;
  color:var(--gold);
  letter-spacing:1px;
}

.topbar-right {
  display:flex;
  align-items:center;
  gap:16px;
}

.topbar-user {
  font-size:13px;
  color:var(--text2);
  font-family:'DM Mono',monospace;
}

.btn-sm-gold {
  padding:7px 16px;
  background:transparent;
  border:1px solid var(--gold);
  color:var(--gold);
  font-size:12px;
  font-family:'DM Sans',sans-serif;
  font-weight:600;
  cursor:pointer;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:all 0.2s;
}

.btn-sm-gold:hover { background:var(--gold); color:#000; }

/* MAIN LAYOUT */
.app-body { display:flex; min-height:calc(100vh - 60px); }

/* SIDEBAR */
.app-sidebar {
  width:220px;
  background:var(--dark2);
  border-right:1px solid var(--border);
  padding:24px 0;
  flex-shrink:0;
  position:sticky;
  top:60px;
  height:calc(100vh - 60px);
  overflow-y:auto;
}

.sidebar-section-label {
  font-size:10px;
  color:var(--text3);
  letter-spacing:3px;
  text-transform:uppercase;
  padding:16px 20px 8px;
  font-family:'DM Mono',monospace;
}

.nav-btn {
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 20px;
  cursor:pointer;
  transition:all 0.2s;
  font-size:13px;
  color:var(--text2);
  border-left:3px solid transparent;
  width:100%;
  background:none;
  border-right:none;
  border-top:none;
  border-bottom:none;
  text-align:left;
  font-family:'DM Sans',sans-serif;
}

.nav-btn:hover { color:var(--text); background:rgba(201,168,76,0.05); }
.nav-btn.active { color:var(--gold); border-left-color:var(--gold); background:rgba(201,168,76,0.08); }
.nav-btn .ni { font-size:16px; width:20px; text-align:center; }

/* CONTENT */
.app-content { flex:1; padding:28px; overflow-x:hidden; }

/* VIEWS */
.view { display:none; animation:fadeUp 0.3s ease; }
.view.active { display:block; }

/* PAGE HEADER */
.view-header {
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  margin-bottom:28px;
  flex-wrap:wrap;
  gap:12px;
}

.view-title {
  font-family:'Playfair Display',serif;
  font-size:28px;
  font-weight:900;
  letter-spacing:-0.5px;
}

.view-subtitle { font-size:13px; color:var(--text2); margin-top:4px; }

/* DASHBOARD GRID */
.dash-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1px;
  background:var(--border);
  margin-bottom:24px;
}

.dash-card {
  background:var(--dark2);
  padding:24px;
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:background 0.2s;
}

.dash-card:hover { background:var(--dark3); }

.dash-card::after {
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:2px;
}

.dash-card.gold::after { background:var(--gold); }
.dash-card.green::after { background:var(--green); }
.dash-card.red::after { background:var(--red); }
.dash-card.blue::after { background:var(--blue); }

.dc-icon { font-size:24px; margin-bottom:12px; }
.dc-label { font-size:10px; color:var(--text2); letter-spacing:2px; text-transform:uppercase; font-family:'DM Mono',monospace; margin-bottom:8px; }
.dc-value { font-family:'Playfair Display',serif; font-size:26px; font-weight:900; }
.dc-value.gold { color:var(--gold); }
.dc-value.green { color:var(--green); }
.dc-value.red { color:var(--red); }
.dc-value.blue { color:var(--blue); }
.dc-sub { font-size:11px; color:var(--text3); margin-top:6px; }

/* MODULE GRID */
.module-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1px;
  background:var(--border);
}

.module-btn {
  background:var(--dark2);
  padding:28px 20px;
  cursor:pointer;
  transition:all 0.2s;
  text-align:center;
  border:none;
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  position:relative;
  overflow:hidden;
}

.module-btn::before {
  content:'';
  position:absolute;
  inset:0;
  background:rgba(201,168,76,0);
  transition:background 0.3s;
}

.module-btn:hover::before { background:rgba(201,168,76,0.05); }
.module-btn:hover { transform:translateY(-1px); }

.module-btn.active-module { border-top:2px solid var(--gold); }
.module-btn .mb-icon { font-size:32px; margin-bottom:12px; }
.module-btn .mb-name { font-size:14px; font-weight:600; color:var(--text); }
.module-btn .mb-desc { font-size:11px; color:var(--text2); margin-top:4px; }
.module-btn .mb-badge {
  display:inline-block;
  background:var(--gold);
  color:#000;
  font-size:9px;
  padding:2px 8px;
  letter-spacing:1px;
  margin-top:8px;
  font-family:'DM Mono',monospace;
}
.module-btn .mb-badge.soon { background:var(--dark4); color:var(--text2); }

/* CARD */
.card {
  background:var(--dark2);
  border:1px solid var(--border);
  padding:24px;
  margin-bottom:20px;
}

.card-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid var(--border);
}

.card-title {
  font-family:'Playfair Display',serif;
  font-size:17px;
  font-weight:700;
}

/* FORM */
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:16px; }
.form-col { margin-bottom:16px; }
.lbl { font-size:11px; color:var(--text2); letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; font-family:'DM Mono',monospace; display:block; }
.finp {
  width:100%;
  background:var(--dark3);
  border:1px solid var(--border);
  padding:12px 14px;
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:13px;

.form-row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:16px; }
.form-col { margin-bottom:16px; }
.lbl { font-size:11px; color:var(--text2); letter-spacing:2px; text-transform:uppercase; margin-bottom:8px; font-family:'DM Mono',monospace; display:block; }
.finp {
  width:100%;
  background:var(--dark3);
  border:1px solid var(--border);
  padding:12px 14px;
  color:var(--text);
  font-family:'DM Mono',monospace;
  font-size:13px;
  outline:none;
  transition:border-color 0.2s;
}
.finp:focus { border-color:var(--gold); }
.finp option { background:var(--dark3); }

/* BUTTONS */
.btn-primary {
  padding:12px 28px;
  background:var(--gold);
  color:#000;
  border:none;
  font-family:'DM Sans',sans-serif;
  font-weight:700;
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
}

.btn-primary:hover { background:var(--gold2); transform:translateY(-1px); }

.btn-ghost {
  padding:12px 28px;
  background:transparent;
  color:var(--text2);
  border:1px solid var(--border);
  font-family:'DM Sans',sans-serif;
  font-weight:600;
  font-size:13px;
  cursor:pointer;
  transition:all 0.2s;
}

.btn-ghost:hover { border-color:var(--gold); color:var(--gold); }

.btn-danger {
  padding:7px 14px;
  background:transparent;
  color:var(--red);
  border:1px solid var(--red);
  font-size:12px;
  cursor:pointer;
  transition:all 0.2s;
  font-family:'DM Sans',sans-serif;
}

.btn-danger:hover { background:var(--red); color:#fff; }

/* TABLE */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th {
  text-align:left;
  padding:10px 14px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--text2);
  border-bottom:1px solid var(--border);
  font-family:'DM Mono',monospace;
  white-space:nowrap;
}
td { padding:13px 14px; border-bottom:1px solid rgba(255,255,255,0.03); vertical-align:middle; }
tr:hover td { background:rgba(201,168,76,0.03); }

/* BADGES */
.badge {
  display:inline-block;
  padding:3px 10px;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  font-family:'DM Mono',monospace;
}
.badge-income { background:rgba(82,201,122,0.15); color:var(--green); }
.badge-expense { background:rgba(224,82,82,0.15); color:var(--red); }
.badge-cash { background:rgba(201,168,76,0.15); color:var(--gold); }
.badge-bank { background:rgba(82,138,224,0.15); color:var(--blue); }
.badge-esewa { background:rgba(96,187,70,0.15); color:var(--esewa); }

/* FILTER BAR */
.filter-bar {
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
  align-items:center;
}

.filter-bar .finp { margin-bottom:0; }
