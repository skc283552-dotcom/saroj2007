<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Transaction - Accounting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Back Button -->
        <div class="mb-6">
            <button onclick="window.location.href='dashboard.html'" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </button>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-6">New Transaction</h1>
            
            <form id="transactionForm">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Account Name *</label>
                    <input type="text" id="accountName" list="accountNames" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="e.g., Cash, Bank Account, Salary">
                    <datalist id="accountNames">
                        <option>Cash</option>
                        <option>Bank Account</option>
                        <option>Salary</option>
                        <option>Rent Expense</option>
                        <option>Office Supplies</option>
                        <option>Utilities</option>
                    </datalist>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Account Type *</label>
                    <select id="accountType" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Select Type</option>
                        <option value="Asset">Asset</option>
                        <option value="Liability">Liability</option>
                        <option value="Equity">Equity</option>
                        <option value="Income">Income</option>
                        <option value="Expense">Expense</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Payment Type *</label>
                    <select id="paymentType" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Select Payment Type</option>
                        <option value="Cash">Cash</option>
                        <option value="Bank">Bank</option>
                        <option value="eSewa">eSewa</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Amount *</label>
                    <input type="number" id="amount" step="0.01" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="0.00">
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Date</label>
                    <input type="date" id="date"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Remarks</label>
                    <textarea id="remarks" rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        placeholder="Optional remarks..."></textarea>
                </div>

                <div id="message" class="mb-4 text-sm hidden"></div>

                <button type="submit"
                    class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition transform hover:scale-105">
                    Save Transaction
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Set default date to today
        document.getElementById('date').valueAsDate = new Date();

        // Check authentication
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            }
        });

        // Form submission
        document.getElementById('transactionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const user = auth.currentUser;
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            const transaction = {
                userId: user.uid,
                accountName: document.getElementById('accountName').value,
                accountType: document.getElementById('accountType').value,
                paymentType: document.getElementById('paymentType').value,
                amount: parseFloat(document.getElementById('amount').value),
                date: document.getElementById('date').value,
                remarks: document.getElementById('remarks').value,
                timestamp: serverTimestamp()
            };

            const messageDiv = document.getElementById('message');

            try {
                await addDoc(collection(db, 'transactions'), transaction);
                messageDiv.className = 'mb-4 text-sm text-green-600';
                messageDiv.textContent = '✓ Transaction saved successfully!';
                messageDiv.classList.remove('hidden');
                
                // Reset form except date
                document.getElementById('transactionForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                
                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                }, 3000);
            } catch (error) {
                messageDiv.className = 'mb-4 text-sm text-red-600';
                messageDiv.textContent = 'Error: ' + error.message;
                messageDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
