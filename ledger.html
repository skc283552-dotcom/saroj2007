<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger - Accounting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Header with Back Button and Controls -->
        <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
            <button onclick="window.location.href='dashboard.html'" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </button>
            
            <div class="flex gap-2">
                <select id="pdfOption" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="full">Full Table</option>
                    <option value="selected">Selected Rows</option>
                </select>
                <button id="downloadPdf" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                    Download PDF
                </button>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <input type="text" id="searchAccount" placeholder="Search by account name..." 
                    class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                
                <select id="filterType" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">All Account Types</option>
                    <option value="Asset">Asset</option>
                    <option value="Liability">Liability</option>
                    <option value="Equity">Equity</option>
                    <option value="Income">Income</option>
                    <option value="Expense">Expense</option>
                </select>
                
                <select id="filterPayment" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">All Payment Types</option>
                    <option value="Cash">Cash</option>
                    <option value="Bank">Bank</option>
                    <option value="eSewa">eSewa</option>
                </select>
                
                <input type="date" id="fromDate" placeholder="From Date" 
                    class="px-4 py-2 border border-gray-300 rounded-lg">
                
                <input type="date" id="toDate" placeholder="To Date" 
                    class="px-4 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <!-- Ledger Table -->
        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                            <input type="checkbox" id="selectAll"> Select
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Account Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Payment</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Remarks</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="ledgerBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentTransactions = [];

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                loadLedger(user.uid);
                setupFilters(user.uid);
            }
        });

        function loadLedger(userId) {
            const q = query(collection(db, 'transactions'), where('userId', '==', userId));
            
            onSnapshot(q, (snapshot) => {
                currentTransactions = [];
                snapshot.forEach((doc) => {
                    currentTransactions.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
            });
        }

        function renderTable() {
            const searchTerm = document.getElementById('searchAccount').value.toLowerCase();
            const filterType = document.getElementById('filterType').value;
            const filterPayment = document.getElementById('filterPayment').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;

            let filtered = currentTransactions.filter(transaction => {
                if (searchTerm && !transaction.accountName?.toLowerCase().includes(searchTerm)) return false;
                if (filterType && transaction.accountType !== filterType) return false;
                if (filterPayment && transaction.paymentType !== filterPayment) return false;
                if (fromDate && transaction.date < fromDate) return false;
                if (toDate && transaction.date > toDate) return false;
                return true;
            });

            const tbody = document.getElementById('ledgerBody');
            tbody.innerHTML = '';

            filtered.forEach(transaction => {
                const row = tbody.insertRow();
                row.setAttribute('data-id', transaction.id);
                
                // Checkbox cell
                const cellCheck = row.insertCell(0);
                cellCheck.className = 'px-6 py-4';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'rowCheckbox';
                cellCheck.appendChild(checkbox);
                
                // Editable cells
                const fields = ['accountName', 'accountType', 'paymentType', 'amount', 'date', 'remarks'];
                fields.forEach(field => {
                    const cell = row.insertCell();
                    cell.className = 'px-6 py-4';
                    const input = document.createElement('input');
                    input.type = field === 'amount' ? 'number' : 'text';
                    input.value = transaction[field] || '';
                    input.className = 'w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500';
                    input.addEventListener('change', () => updateTransaction(transaction.id, field, input.value));
                    cell.appendChild(input);
                });
                
                // Delete button
                const cellAction = row.insertCell();
                cellAction.className = 'px-6 py-4';
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700';
                deleteBtn.onclick = () => deleteTransaction(transaction.id);
                cellAction.appendChild(deleteBtn);
            });
        }

        async function updateTransaction(id, field, value) {
            const user = auth.currentUser;
            if (!user) return;
            
            try {
                const docRef = doc(db, 'transactions', id);
                await updateDoc(docRef, { [field]: value });
            } catch (error) {
                console.error('Error updating transaction:', error);
                alert('Error updating transaction: ' + error.message);
            }
        }

        async function deleteTransaction(id) {
            if (confirm('Are you sure you want to delete this transaction?')) {
                try {
                    await deleteDoc(doc(db, 'transactions', id));
                } catch (error) {
                    console.error('Error deleting transaction:', error);
                    alert('Error deleting transaction: ' + error.message);
                }
            }
        }

        function setupFilters(userId) {
            const filters = ['searchAccount', 'filterType', 'filterPayment', 'fromDate', 'toDate'];
            filters.forEach(filter => {
                document.getElementById(filter).addEventListener('input', () => renderTable());
                document.getElementById(filter).addEventListener('change', () => renderTable());
            });
        }

        // PDF Export
        document.getElementById('downloadPdf').addEventListener('click', async () => {
            const option = document.getElementById('pdfOption').value;
            const table = document.querySelector('table');
            
            // Get selected rows if needed
            if (option === 'selected') {
                const checkboxes = document.querySelectorAll('.rowCheckbox:checked');
                if (checkboxes.length === 0) {
                    alert('Please select at least one row to export');
                    return;
                }
                // Hide unselected rows temporarily
                const allRows = document.querySelectorAll('#ledgerBody tr');
                allRows.forEach((row, index) => {
                    const checkbox = row.querySelector('.rowCheckbox');
                    if (!checkbox.checked) {
                        row.style.display = 'none';
                    }
                });
            }
            
            try {
                const canvas = await html2canvas(table, {
                    scale: 2,
                    backgroundColor: '#ffffff'
                });
                
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('landscape', 'mm', 'a4');
                const imgWidth = 280;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
                pdf.save('ledger.pdf');
            } catch (error) {
                console.error('Error generating PDF:', error);
                alert('Error generating PDF: ' + error.message);
            }
            
            // Restore hidden rows
            if (option === 'selected') {
                const allRows = document.querySelectorAll('#ledgerBody tr');
                allRows.forEach(row => {
                    row.style.display = '';
                });
            }
        });
        
        // Select All functionality
        document.getElementById('selectAll').addEventListener('change', (e) => {
            const checkboxes = document.querySelectorAll('.rowCheckbox');
            checkboxes.forEach(cb => cb.checked = e.target.checked);
        });
    </script>
</body>
</html>
