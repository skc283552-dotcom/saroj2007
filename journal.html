<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal Entries - Accounting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans">
    <div class="container mx-auto px-4 py-8">
        <!-- Back Button -->
        <div class="mb-6">
            <button onclick="window.location.href='dashboard.html'" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 transition flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Back to Dashboard
            </button>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <input type="text" id="searchAccount" placeholder="Search by account name..." 
                    class="px-4 py-2 border border-gray-300 rounded-lg">
                
                <select id="filterType" class="px-4 py-2 border border-gray-300 rounded-lg">
                    <option value="">All Account Types</option>
                    <option value="Asset">Asset</option>
                    <option value="Liability">Liability</option>
                    <option value="Equity">Equity</option>
                    <option value="Income">Income</option>
                    <option value="Expense">Expense</option>
                </select>
                
                <input type="date" id="fromDate" placeholder="From Date" class="px-4 py-2 border border-gray-300 rounded-lg">
                <input type="date" id="toDate" placeholder="To Date" class="px-4 py-2 border border-gray-300 rounded-lg">
            </div>
        </div>

        <!-- Journal Table -->
        <div class="bg-white rounded-lg shadow-md overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Account Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Account Type</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Debit ($)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Credit ($)</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Remarks</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="journalBody" class="bg-white divide-y divide-gray-200"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentEntries = [];

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                loadJournalEntries(user.uid);
                setupFilters(user.uid);
            }
        });

        function loadJournalEntries(userId) {
            const q = query(collection(db, 'journalEntries'), where('userId', '==', userId));
            
            onSnapshot(q, (snapshot) => {
                currentEntries = [];
                snapshot.forEach((doc) => {
                    currentEntries.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
            });
        }

        function renderTable() {
            const searchTerm = document.getElementById('searchAccount').value.toLowerCase();
            const filterType = document.getElementById('filterType').value;
            const fromDate = document.getElementById('fromDate').value;
            const toDate = document.getElementById('toDate').value;

            let filtered = currentEntries.filter(entry => {
                if (searchTerm && !entry.accountName?.toLowerCase().includes(searchTerm)) return false;
                if (filterType && entry.accountType !== filterType) return false;
                if (fromDate && entry.date < fromDate) return false;
                if (toDate && entry.date > toDate) return false;
                return true;
            });

            const tbody = document.getElementById('journalBody');
            tbody.innerHTML = '';

            filtered.forEach(entry => {
                const row = tbody.insertRow();
                row.setAttribute('data-id', entry.id);
                
                // Editable fields
                const fields = ['accountName', 'accountType', 'debit', 'credit', 'date', 'remarks'];
                fields.forEach(field => {
                    const cell = row.insertCell();
                    cell.className = 'px-6 py-4';
                    
                    if (field === 'debit' || field === 'credit') {
                        const input = document.createElement('input');
                        input.type = 'number';
                        input.step = '0.01';
                        input.value = entry[field] || 0;
                        input.className = 'w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500';
                        input.addEventListener('change', () => updateEntry(entry.id, field, parseFloat(input.value)));
                        cell.appendChild(input);
                    } else {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = entry[field] || '';
                        input.className = 'w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500';
                        input.addEventListener('change', () => updateEntry(entry.id, field, input.value));
                        cell.appendChild(input);
                    }
                });
                
                // Delete button
                const cellAction = row.insertCell();
                cellAction.className = 'px-6 py-4';
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700';
                deleteBtn.onclick = () => deleteEntry(entry.id);
                cellAction.appendChild(deleteBtn);
            });
        }

        async function updateEntry(id, field, value) {
            const user = auth.currentUser;
            if (!user) return;
            
            try {
                const docRef = doc(db, 'journalEntries', id);
                await updateDoc(docRef, { [field]: value });
            } catch (error) {
                console.error('Error updating entry:', error);
                alert('Error updating entry: ' + error.message);
            }
        }

        async function deleteEntry(id) {
            if (confirm('Are you sure you want to delete this journal entry?')) {
                try {
                    await deleteDoc(doc(db, 'journalEntries', id));
                } catch (error) {
                    console.error('Error deleting entry:', error);
                    alert('Error deleting entry: ' + error.message);
                }
            }
        }

        function setupFilters(userId) {
            const filters = ['searchAccount', 'filterType', 'fromDate', 'toDate'];
            filters.forEach(filter => {
                document.getElementById(filter).addEventListener('input', () => renderTable());
                document.getElementById(filter).addEventListener('change', () => renderTable());
            });
        }
    </script>
</body>
</html>
